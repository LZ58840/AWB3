version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Pinned to one version each, and the peer pins make them move together: vitest with its coverage package, devvit with its packages.
      vitest:
        patterns: [vitest, '@vitest/*']
      devvit:
        patterns: [devvit, '@devvit/*']
    ignore:
      # js-yaml 4+ reads YAML 1.2 (010 = 10). The legacy bot reads the awb wiki page with PyYAML (YAML 1.1); js-yaml 3 agrees with it.
      - dependency-name: js-yaml
        update-types: ['version-update:semver-major']
  - package-ecosystem: pip
    directory: /tools # tools/requirements.txt
    schedule:
      interval: weekly
  - package-ecosystem: github-actions # the actions in .github/workflows are pinned to a commit; this keeps the pins and their version comments current
    directory: /
    schedule:
      interval: weekly
